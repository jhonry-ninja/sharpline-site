<div class="box"><ul>
<li>A friend signs up with your code: you get a free week of SharpLine Pro.</li>
<li>Your friend makes their first paid subscription payment: you earn 50% of what SharpLine receives from that payment.</li>
<li>Earnings become available 60 days after the payment, if it isn't refunded.</li>
<li>Cash out by PayPal once you have $10 or more available.</li>
</ul></div>
<h2>1. Who can take part</h2>
<p>You need a SharpLine account in good standing, must be at least 18 (or the age of majority where you live), and need a PayPal account that can receive payments. Your invite code is your SharpLine username.</p>
<h2>2. Qualifying referrals</h2>
<p>A referral qualifies when a <strong>new</strong> user enters your code at sign-up or within their first 14 days. Each new user can use one code, and a person you invited can't invite you back.</p>
<h2>3. Free Pro for sign-ups</h2>
<p>Each qualifying sign-up gives you 7 days of SharpLine Pro, up to 12 free weeks total. Free Pro doesn't renew, doesn't charge you, and has no cash value.</p>
<h2>4. Cash commission</h2>
<p><strong>Amount:</strong> 50% of the net amount SharpLine receives from your friend's <strong>first paid</strong> subscription payment ("net" means after the app store's fee and any taxes it withholds). Free trials and renewals don't earn a commission.</p>
<p><strong>Hold:</strong> commissions stay Pending for 60 days. If the payment is refunded in that time, the commission is cancelled. Up to 10 commissions per person become Available each calendar month; any extra roll into the next month.</p>
<h2>5. Getting paid</h2>
<p>With <strong>$10 or more</strong> Available, enter your PayPal email in the app (More &gt; Invite friends) and tap Cash Out. Payouts go out by PayPal in US dollars at the start of each month. Payments sent to the email you entered count as delivered. One open request at a time.</p>
<h2>6. Taxes</h2>
<p>Commissions may be taxable. If you earn $600 or more from SharpLine in a year, we'll ask for an IRS Form W-9 before further payouts and may issue a Form 1099. You're responsible for taxes on your earnings.</p>
<h2>7. Fair play</h2>
<p>Not allowed: referring yourself (second accounts, accounts you control, fake identities); spam or misleading claims, including promising profits or guaranteed wins; paying people to sign up; ads using the SharpLine name or posing as SharpLine. SharpLine may review any referral and withhold or reverse commissions it reasonably believes are fraudulent or break these terms.</p>
<h2>8. Changes</h2>
<p>SharpLine may change or end the program at any time by updating this page. Commissions already Available before a change are kept, and Available balances of $10 or more will still be paid if the program ends.</p>
<h2>9. Other terms</h2>
<p>These terms add to SharpLine's <a href="/terms">Terms of Use</a> and <a href="/privacy">Privacy Policy</a>. SharpLine is for information and entertainment only, does not accept wagers, and does not guarantee results. Referral rewards are offered by SharpLine, not Apple; Apple is not a sponsor of this program.</p>
<p class="dim">Questions? Email <a href="mailto:support@sharpline.pro">support@sharpline.pro</a>.</p>
